name: Build

# Test build only. Nothing is uploaded or kept on GitHub.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Build debug app and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest
      # Unsigned here, because pull requests have no access to the upload key. This only
      # checks that the bundle the Release workflow sends to Google Play still builds.
      - name: Build release bundle
        run: ./gradlew bundleRelease
