name: Release

# Runs when versionName in app/build.gradle.kts changes on main. It builds the app signed with
# the private upload key and publishes it twice:
#   1. as a GitHub release named v<versionName> in this repository, with the APK and the AAB
#   2. to the internal testing track of Google Play (the AAB)
# A version that already has a GitHub release is skipped. Running the workflow by hand
# (Actions > Release > Run workflow) with the Google Play box ticked sends the current
# version to Google Play again, for when that upload failed.
#
# Repository secrets (docs/play-release.md explains how to create them):
#   UPLOAD_KEYSTORE_BASE64     the upload keystore, base64 encoded
#   UPLOAD_KEYSTORE_PASSWORD   its password
#   PLAY_SERVICE_ACCOUNT_JSON  key of the service account allowed to upload to Google Play
# Optional repository variable PLAY_RELEASE_STATUS: "draft" (the default) leaves each upload
# in Play Console for you to roll out, "completed" rolls it out to the testers right away.
on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
  workflow_dispatch:
    inputs:
      play:
        description: Upload this version to Google Play internal testing
        type: boolean
        default: false

permissions:
  contents: write

env:
  PLAY_PACKAGE: com.bane23.parentalcontrol

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the release notes

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          code=$(sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "Could not read versionName and versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

          release=true
          if gh release view "v$name" > /dev/null 2>&1; then
            echo "Release v$name already exists here."
            release=false
          fi

          # Google Play gets every new version, and a run by hand that asks for it.
          play=$release
          if [ "${{ inputs.play }}" = "true" ]; then
            play=true
          fi

          build=false
          if [ "$release" = "true" ] || [ "$play" = "true" ]; then
            build=true
          fi
          {
            echo "release=$release"
            echo "play=$play"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.build == 'true'

      - name: Prepare the upload key
        if: steps.version.outputs.build == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::error::The secrets UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD are not set, so nothing was built. Add them (docs/play-release.md) and run this workflow again."
            exit 1
          fi
          # Outside the checkout, so the key can never end up in a release or a commit.
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        if: steps.version.outputs.build == 'true'
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease
          # An unsigned build has another file name, so this fails rather than publish one.
          cp app/build/outputs/apk/release/app-release.apk "parental-control-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "parental-control-${{ steps.version.outputs.name }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        run: |
          version="${{ steps.version.outputs.name }}"
          gh release create "v$version" "parental-control-$version.apk" "parental-control-$version.aab" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --generate-notes

      # Last, so a problem on the Google side never holds back the GitHub release.
      - name: Check the Google Play secret
        id: play
        if: steps.version.outputs.play == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::The secret PLAY_SERVICE_ACCOUNT_JSON is not set, so this version was not sent to Google Play. Upload the AAB from the GitHub release by hand, or add the secret (docs/play-release.md) and run this workflow again with the Google Play box ticked."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play internal testing
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE }}
          releaseFiles: parental-control-${{ steps.version.outputs.name }}.aab
          releaseName: ${{ steps.version.outputs.name }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
