name: Release

# Publishes a GitHub release with the APK when versionName in app/build.gradle.kts
# changes on main. A version that already has a release is skipped.
on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$name" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" > /dev/null 2>&1; then
            echo "Release v$name already exists, nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Firebase config
        if: steps.version.outputs.needed == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "The GOOGLE_SERVICES_JSON secret is missing. See docs/firebase-setup.md, step 6." >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - uses: actions/setup-java@v4
        if: steps.version.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.needed == 'true'

      - name: Build APK
        if: steps.version.outputs.needed == 'true'
        run: ./gradlew assembleDebug

      - name: Publish release
        if: steps.version.outputs.needed == 'true'
        run: |
          version="${{ steps.version.outputs.name }}"
          apk="parental-control-$version.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "v$version" "$apk" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --generate-notes
